name: Test

on: [push]

jobs:
  clean:
    runs-on: ubuntu-latest
    name: Delete old test images
    steps:
      - uses: snok/container-retention-policy@v3.0.0
        with:
          account: killmenot
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: "github-test-staging"
          image-tags: "*alpha*"
          # cut-off: 2w 3d
          dry-run: true
